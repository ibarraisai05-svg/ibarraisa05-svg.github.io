<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Para Michelin ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffe8ee, #fff7f9);
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  h1 {
    color: #d6336c;
    margin: 0 0 10px;
    font-size: 24px;
  }
  #game {
    width: min(92vw, 430px);
    height: min(78vh, 650px);
    border-radius: 24px;
    box-shadow: 0 8px 30px rgba(150,40,80,.18);
    background: #fff;
  }
  button {
    margin-top: 14px;
    border: 0;
    border-radius: 30px;
    padding: 14px 30px;
    background: #ff4d6d;
    color: white;
    font-size: 19px;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(255,77,109,.25);
  }
  #hint {
    margin-top: 9px;
    color: #8e2450;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>❤️ Un pequeño juego para ti ❤️</h1>
<canvas id="game"></canvas>
<button id="play">▶ PLAY ❤️</button>
<div id="hint">Mueve el dedo de izquierda a derecha para atrapar los corazones</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const play = document.getElementById("play");
const hint = document.getElementById("hint");

let W, H, player, hearts = [], score = 0;
let phase = "idle";
let animation = null, spawnTimer = null;
let keys = {left:false, right:false};
let touchX = null;

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width;
  H = rect.height;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (player) player.y = H - 65;
  draw();
}
window.addEventListener("resize", resize);

function start() {
  cancelAnimationFrame(animation);
  clearInterval(spawnTimer);

  score = 0;
  hearts = [];
  phase = "running";

  player = {
    x: W / 2 - 40,
    y: H - 65,
    width: 80,
    height: 32,
    speed: 7
  };

  play.textContent = "❤️ JUGANDO...";
  play.style.background = "#d6336c";
  hint.textContent = "Atrapa 10 corazones ❤️";

  spawnTimer = setInterval(createHeart, 1050);
  animation = requestAnimationFrame(loop);
  draw();
}

function createHeart() {
  if (phase !== "running") return;
  hearts.push({
    x: 25 + Math.random() * (W - 50),
    y: -25,
    size: 19 + Math.random() * 7,
    speed: 1.45 + Math.random() * 1.1
  });
}

function loop() {
  update();
  draw();
  if (phase === "running") animation = requestAnimationFrame(loop);
}

function update() {
  if (keys.left) player.x -= player.speed;
  if (keys.right) player.x += player.speed;

  player.x = Math.max(0, Math.min(W - player.width, player.x));

  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.y += h.speed;

    const caught =
      h.x + h.size > player.x &&
      h.x - h.size < player.x + player.width &&
      h.y + h.size > player.y &&
      h.y - h.size < player.y + player.height;

    if (caught) {
      score++;
      hearts.splice(i,1);
      if (score >= 10) finish();
    } else if (h.y > H + 40) {
      hearts.splice(i,1);
    }
  }
}

function finish() {
  phase = "finished";
  clearInterval(spawnTimer);
  spawnTimer = null;
  hearts = [];
  play.textContent = "↻ JUGAR OTRA VEZ";
  play.style.background = "#ff4d6d";
  hint.textContent = "❤️";
}

function draw() {
  ctx.clearRect(0,0,W,H);

  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#fff7f9");
  g.addColorStop(1,"#ffe0e8");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  if (phase === "idle") return drawStart();
  if (phase === "finished") return drawFinal();

  ctx.textAlign = "center";
  ctx.fillStyle = "#d6336c";
  ctx.font = "bold 22px Arial";
  ctx.fillText("Atrapa los corazones", W/2, 32);

  ctx.fillStyle = "#8e2450";
  ctx.font = "bold 20px Arial";
  ctx.fillText(score + " / 10 ❤️", W/2, 62);

  hearts.forEach(h => drawHeart(h.x,h.y,h.size));
  drawPlayer();
}

function drawStart() {
  ctx.textAlign = "center";
  ctx.fillStyle = "#d6336c";
  ctx.font = "bold 29px Arial";
  ctx.fillText("❤️ Para Michelin ❤️", W/2, H/2-55);

  ctx.fillStyle = "#8e2450";
  ctx.font = "18px Arial";
  ctx.fillText("Atrapa 10 corazones", W/2, H/2-10);
  ctx.fillText("y descubre tu mensaje", W/2, H/2+22);

  ctx.font = "28px Arial";
  ctx.fillText("❤️  ❤️  ❤️", W/2, H/2+75);
}

function drawFinal() {
  ctx.textAlign = "center";

  drawHeart(48,80,20);
  drawHeart(W-48,80,20);
  drawHeart(48,H-65,18);
  drawHeart(W-48,H-65,18);

  ctx.fillStyle = "#d6336c";
  ctx.font = "bold 31px Arial";
  ctx.fillText("¡Lo lograste! ❤️", W/2, H/2-105);

  ctx.fillStyle = "#8e2450";
  ctx.font = "bold 20px Arial";
  ctx.fillText("Atrapaste los 10 corazones", W/2, H/2-58);

  ctx.font = "18px Arial";
  ctx.fillText("Pero hay uno que no necesitaste atrapar...", W/2, H/2-12);

  ctx.fillStyle = "#d6336c";
  ctx.font = "bold 23px Arial";
  ctx.fillText("porque ya tienes el mío ❤️", W/2, H/2+32);

  ctx.font = "bold 25px Arial";
  ctx.fillText("Te quiero, Michelin ❤️", W/2, H/2+82);
}

function drawHeart(x,y,s) {
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = "#ff4d6d";
  ctx.beginPath();
  ctx.moveTo(0,s*.9);
  ctx.bezierCurveTo(-s*1.25,0,-s*.72,-s,0,-s*.28);
  ctx.bezierCurveTo(s*.72,-s,s*1.25,0,0,s*.9);
  ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  ctx.fillStyle = "#d6336c";
  ctx.beginPath();
  ctx.roundRect(player.x,player.y,player.width,player.height,12);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.font = "21px Arial";
  ctx.textAlign = "center";
  ctx.fillText("♥",player.x+player.width/2,player.y+23);
}

play.addEventListener("click", start);

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = true;
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = true;
});
document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = false;
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = false;
});

canvas.addEventListener("touchstart", e => {
  touchX = e.touches[0].clientX;
}, {passive:true});

canvas.addEventListener("touchmove", e => {
  if (phase !== "running") return;
  const x = e.touches[0].clientX;
  const dx = x - touchX;
  if (Math.abs(dx) > 4) {
    player.x += dx * 0.75;
    player.x = Math.max(0, Math.min(W-player.width, player.x));
    touchX = x;
  }
}, {passive:true});

canvas.addEventListener("touchend", () => touchX = null, {passive:true});

resize();
</script>
</body>
</html>
