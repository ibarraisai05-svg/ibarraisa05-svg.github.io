<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Michelle Crack</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 50% 20%, #696355 0%, #343633 45%, #07131a 100%);
    font-family:Arial,sans-serif;
}

/* ESCENA */

.escena{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* LUZ */

.luz{
    position:absolute;
    width:500px;
    height:500px;
    left:50%;
    top:0;
    transform:translateX(-50%);
    background:rgba(255,235,100,.08);
    border-radius:50%;
    filter:blur(70px);
}

/* =========================
   FLORES
========================= */

.flor{
    position:absolute;
    bottom:80px;
    width:180px;
    height:470px;
    transform-origin:bottom center;
    animation:balanceo 3.5s ease-in-out infinite;
    z-index:5;
}

.flor1{
    left:-10px;
    transform:scale(.75);
}

.flor2{
    left:20%;
    transform:scale(.85);
    animation-delay:.7s;
}

.flor3{
    right:20%;
    transform:scale(.95);
    animation-delay:.3s;
}

.flor4{
    right:-10px;
    transform:scale(.75);
    animation-delay:1s;
}

/* TALLOS */

.tallo{
    position:absolute;
    width:13px;
    height:370px;
    left:84px;
    bottom:0;
    border-radius:100%;

    background:
        linear-gradient(
            90deg,
            #176525,
            #5bd43e,
            #217d2c
        );
}

.curvo1{
    transform:rotate(-9deg);
}

.curvo2{
    transform:rotate(8deg);
}

/* HOJAS */

.hoja{
    position:absolute;
    width:82px;
    height:40px;

    background:
        linear-gradient(
            135deg,
            #7ae84b,
            #258c32
        );

    border-radius:100% 0 100% 0;
    transform-origin:left center;
}

.hoja1{
    left:82px;
    bottom:100px;
    transform:rotate(-35deg);
}

.hoja2{
    left:88px;
    bottom:170px;
    transform:rotate(35deg);
}

.hoja3{
    left:75px;
    bottom:245px;
    transform:rotate(-40deg);
}

.hoja4{
    left:88px;
    bottom:300px;
    transform:rotate(35deg);
}

/* CABEZA DE LA FLOR */

.cabeza{
    position:absolute;
    width:165px;
    height:125px;
    left:7px;
    top:0;
}

.petalo{
    position:absolute;

    width:76px;
    height:88px;

    background:
        radial-gradient(
            ellipse at 35% 25%,
            #ffff91 0%,
            #f1ff00 42%,
            #b7d900 100%
        );

    border-radius:65% 35% 65% 40%;

    box-shadow:
        inset 5px 5px 10px rgba(255,255,200,.55);
}

.petalo1{
    left:45px;
    top:0;
    transform:rotate(-5deg);
}

.petalo2{
    left:5px;
    top:25px;
    transform:rotate(-48deg);
}

.petalo3{
    right:5px;
    top:25px;
    transform:rotate(48deg);
}

.petalo4{
    left:22px;
    top:55px;
    transform:rotate(-20deg);
}

.petalo5{
    right:22px;
    top:55px;
    transform:rotate(20deg);
}

/* CENTRO */

.centro{
    position:absolute;
    width:50px;
    height:50px;
    left:57px;
    top:48px;
    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffc52e,
            #ff7d00 55%,
            #dc4b00
        );
}

.brillo{
    position:absolute;
    width:75px;
    height:13px;
    left:45px;
    top:43px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    transform:rotate(-7deg);
}

/* =========================
   PASTO
========================= */

.pasto{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:125px;

    background:
        linear-gradient(
            #236c2e,
            #0a2915
        );

    z-index:10;
}

.hierba{
    position:absolute;
    bottom:65px;
    width:8px;
    height:95px;

    background:
        linear-gradient(
            to right,
            #125823,
            #68d846,
            #1b712b
        );

    border-radius:100% 0 100% 0;
    transform-origin:bottom center;

    z-index:12;

    animation:hierba 2.5s ease-in-out infinite;
}

.hierba1{left:4%;transform:rotate(-25deg);}
.hierba2{left:12%;height:120px;transform:rotate(25deg);animation-delay:.3s;}
.hierba3{left:25%;height:90px;transform:rotate(-20deg);animation-delay:.8s;}
.hierba4{left:38%;height:115px;transform:rotate(20deg);animation-delay:1s;}
.hierba5{right:38%;height:100px;transform:rotate(-25deg);animation-delay:.5s;}
.hierba6{right:25%;height:120px;transform:rotate(25deg);animation-delay:.9s;}
.hierba7{right:12%;height:95px;transform:rotate(-25deg);animation-delay:.2s;}
.hierba8{right:4%;height:125px;transform:rotate(25deg);animation-delay:1.2s;}

/* =========================
   PERSONAJE
========================= */

.personaje{
    position:absolute;

    width:185px;
    height:260px;

    left:50%;
    bottom:110px;

    transform:translateX(-50%);

    z-index:20;

    cursor:pointer;
    touch-action:manipulation;

    animation:brinco 1.1s ease-in-out infinite;
}

/* NOMBRE */

.nombre{
    position:absolute;

    width:100%;
    text-align:center;

    top:-48px;

    color:white;

    font-size:25px;
    font-weight:bold;

    text-shadow:
        2px 2px 4px #000,
        -1px -1px 3px #000;

    white-space:nowrap;

    pointer-events:none;
}

/* CUERPO */

.cuerpo{
    position:absolute;

    width:135px;
    height:190px;

    left:25px;
    top:55px;

    background:
        linear-gradient(
            90deg,
            #a90000,
            #ff1b1b 45%,
            #d50000
        );

    border:9px solid #050505;

    border-radius:
        65px 65px 38px 38px;
}

/* MOCHILA */

.mochila{
    position:absolute;

    width:50px;
    height:120px;

    left:0;
    top:100px;

    background:#d40000;

    border:8px solid #050505;

    border-radius:35px 10px 10px 35px;
}

/* VISOR */

.visor{
    position:absolute;

    width:125px;
    height:72px;

    left:45px;
    top:75px;

    background:
        linear-gradient(
            145deg,
            #dffaff 0%,
            #8ed2e8 35%,
            #456875 100%
        );

    border:9px solid #050505;

    border-radius:
        50px 60px 45px 55px;

    z-index:3;
}

.visor::after{
    content:"";

    position:absolute;

    width:58px;
    height:20px;

    top:8px;
    left:30px;

    background:white;

    border-radius:50%;

    opacity:.9;

    transform:rotate(8deg);
}

/* PIERNAS */

.pierna{
    position:absolute;

    width:48px;
    height:72px;

    bottom:0;

    background:#d60000;

    border:9px solid #050505;

    border-top:none;

    border-radius:0 0 25px 25px;
}

.pierna1{
    left:30px;
}

.pierna2{
    right:20px;
}

/* =========================
   PEDACITOS
========================= */

.particula-rompible{
    position:absolute;

    width:15px;
    height:15px;

    background:#ff1b1b;

    border:3px solid #050505;

    border-radius:4px;

    z-index:50;

    pointer-events:none;
}

/* =========================
   PARTÍCULAS DEL FONDO
========================= */

.particula{
    position:absolute;

    width:7px;
    height:7px;

    background:#caff4a;

    border-radius:50%;

    opacity:.7;

    animation:flotar 4s ease-in-out infinite;
}

.p1{left:10%;top:20%;}
.p2{left:30%;top:35%;animation-delay:1s;}
.p3{right:15%;top:25%;animation-delay:2s;}
.p4{right:32%;top:42%;animation-delay:.5s;}
.p5{left:6%;top:48%;animation-delay:1.5s;}
.p6{right:8%;top:55%;animation-delay:2.5s;}

/* =========================
   ANIMACIONES
========================= */

@keyframes balanceo{

    0%,100%{
        rotate:-4deg;
    }

    50%{
        rotate:4deg;
    }
}

@keyframes hierba{

    0%,100%{
        margin-left:0;
    }

    50%{
        margin-left:9px;
    }
}

@keyframes brinco{

    0%,100%{
        bottom:110px;
        transform:translateX(-50%) rotate(0deg);
    }

    45%{
        bottom:220px;
        transform:translateX(-50%) rotate(-3deg);
    }

    55%{
        bottom:220px;
        transform:translateX(-50%) rotate(3deg);
    }
}

@keyframes flotar{

    0%,100%{
        transform:translateY(0);
        opacity:.3;
    }

    50%{
        transform:translateY(-40px);
        opacity:.9;
    }
}

</style>
</head>

<body>

<div class="escena">

<div class="luz"></div>

<!-- PARTÍCULAS -->

<div class="particula p1"></div>
<div class="particula p2"></div>
<div class="particula p3"></div>
<div class="particula p4"></div>
<div class="particula p5"></div>
<div class="particula p6"></div>


<!-- FLOR 1 -->

<div class="flor flor1">

    <div class="tallo curvo1"></div>

    <div class="hoja hoja1"></div>
    <div class="hoja hoja2"></div>
    <div class="hoja hoja3"></div>

    <div class="cabeza">

        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
        <div class="petalo petalo5"></div>

        <div class="centro"></div>
        <div class="brillo"></div>

    </div>
</div>


<!-- FLOR 2 -->

<div class="flor flor2">

    <div class="tallo"></div>

    <div class="hoja hoja1"></div>
    <div class="hoja hoja2"></div>
    <div class="hoja hoja3"></div>
    <div class="hoja hoja4"></div>

    <div class="cabeza">

        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
        <div class="petalo petalo5"></div>

        <div class="centro"></div>
        <div class="brillo"></div>

    </div>
</div>


<!-- FLOR 3 -->

<div class="flor flor3">

    <div class="tallo curvo2"></div>

    <div class="hoja hoja1"></div>
    <div class="hoja hoja2"></div>
    <div class="hoja hoja3"></div>
    <div class="hoja hoja4"></div>

    <div class="cabeza">

        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
        <div class="petalo petalo5"></div>

        <div class="centro"></div>
        <div class="brillo"></div>

    </div>
</div>


<!-- FLOR 4 -->

<div class="flor flor4">

    <div class="tallo curvo2"></div>

    <div class="hoja hoja1"></div>
    <div class="hoja hoja2"></div>
    <div class="hoja hoja3"></div>

    <div class="cabeza">

        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
        <div class="petalo petalo5"></div>

        <div class="centro"></div>
        <div class="brillo"></div>

    </div>
</div>


<!-- PERSONAJE -->

<div class="personaje" id="personaje">

    <div class="nombre">
        Michelle crack
    </div>

    <div class="mochila"></div>

    <div class="cuerpo"></div>

    <div class="visor"></div>

    <div class="pierna pierna1"></div>
    <div class="pierna pierna2"></div>

</div>


<!-- PASTO -->

<div class="pasto"></div>

<div class="hierba hierba1"></div>
<div class="hierba hierba2"></div>
<div class="hierba hierba3"></div>
<div class="hierba hierba4"></div>
<div class="hierba hierba5"></div>
<div class="hierba hierba6"></div>
<div class="hierba hierba7"></div>
<div class="hierba hierba8"></div>

</div>


<script>

/* =========================
   ROMPER AL TOCAR
========================= */

const personaje = document.getElementById("personaje");

let rompiendo = false;

personaje.addEventListener("pointerdown", romperPersonaje);

function romperPersonaje(event){

    event.preventDefault();

    if(rompiendo) return;

    rompiendo = true;

    /* Posición del personaje */

    const rect = personaje.getBoundingClientRect();

    const centroX = rect.left + rect.width / 2;
    const centroY = rect.top + rect.height / 2;

    /* Ocultar personaje */

    personaje.style.visibility = "hidden";

    /* Crear pedacitos */

    for(let i = 0; i < 28; i++){

        const pedazo = document.createElement("div");

        pedazo.className = "particula-rompible";

        pedazo.style.left = centroX + "px";
        pedazo.style.top = centroY + "px";

        document.body.appendChild(pedazo);

        const angulo = Math.random() * Math.PI * 2;
        const distancia = 70 + Math.random() * 150;

        const destinoX =
            Math.cos(angulo) * distancia;

        const destinoY =
            Math.sin(angulo) * distancia;

        const duracion =
            500 + Math.random() * 500;

        pedazo.animate(
            [
                {
                    transform:"translate(-50%,-50%) scale(1)",
                    opacity:1
                },
                {
                    transform:
                    `translate(
                        calc(-50% + ${destinoX}px),
                        calc(-50% + ${destinoY}px)
                    )
                    rotate(${Math.random()*720}deg)
                    scale(.2)`,

                    opacity:0
                }
            ],
            {
                duration:duracion,
                easing:"cubic-bezier(.2,.8,.3,1)"
            }
        );

        setTimeout(()=>{
            pedazo.remove();
        },duracion);
    }

    /* Volver a aparecer */

    setTimeout(()=>{

        personaje.style.visibility = "visible";

        /* Reiniciar animación */

        personaje.style.animation = "none";

        void personaje.offsetWidth;

        personaje.style.animation =
            "brinco 1.1s ease-in-out infinite";

        rompiendo = false;

    },900);

}

</script>

</body>
</html>
