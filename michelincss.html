<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michelle Crack</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:radial-gradient(circle at 50% 20%,#696355 0%,#343633 45%,#07131a 100%);
    font-family:Arial,sans-serif;
}

.escena{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

.luz{
    position:absolute;
    width:500px;
    height:500px;
    left:50%;
    top:0;
    transform:translateX(-50%);
    background:rgba(255,235,100,.08);
    border-radius:50%;
    filter:blur(70px);
}

/* CONTADOR */
#contador{
    position:absolute;
    top:24px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
    z-index:200;
    pointer-events:none;
    white-space:nowrap;
}

/* FLORES */
.flor{
    position:absolute;
    bottom:80px;
    width:180px;
    height:470px;
    transform-origin:bottom center;
    animation:balanceo 3.5s ease-in-out infinite;
    z-index:5;
}
.flor1{left:-10px;transform:scale(.75)}
.flor2{left:20%;transform:scale(.85);animation-delay:.7s}
.flor3{right:20%;transform:scale(.95);animation-delay:.3s}
.flor4{right:-10px;transform:scale(.75);animation-delay:1s}

.tallo{
    position:absolute;
    width:13px;
    height:370px;
    left:84px;
    bottom:0;
    border-radius:100%;
    background:linear-gradient(90deg,#176525,#5bd43e,#217d2c);
}
.curvo1{transform:rotate(-9deg)}
.curvo2{transform:rotate(8deg)}

.hoja{
    position:absolute;
    width:82px;
    height:40px;
    background:linear-gradient(135deg,#7ae84b,#258c32);
    border-radius:100% 0 100% 0;
    transform-origin:left center;
}
.hoja1{left:82px;bottom:100px;transform:rotate(-35deg)}
.hoja2{left:88px;bottom:170px;transform:rotate(35deg)}
.hoja3{left:75px;bottom:245px;transform:rotate(-40deg)}
.hoja4{left:88px;bottom:300px;transform:rotate(35deg)}

.cabeza{
    position:absolute;
    width:165px;
    height:125px;
    left:7px;
    top:0;
}

.petalo{
    position:absolute;
    width:76px;
    height:88px;
    background:radial-gradient(ellipse at 35% 25%,#ffff91 0%,#f1ff00 42%,#b7d900 100%);
    border-radius:65% 35% 65% 40%;
    box-shadow:inset 5px 5px 10px rgba(255,255,200,.55);
}
.petalo1{left:45px;top:0;transform:rotate(-5deg)}
.petalo2{left:5px;top:25px;transform:rotate(-48deg)}
.petalo3{right:5px;top:25px;transform:rotate(48deg)}
.petalo4{left:22px;top:55px;transform:rotate(-20deg)}
.petalo5{right:22px;top:55px;transform:rotate(20deg)}

.centro{
    position:absolute;
    width:50px;
    height:50px;
    left:57px;
    top:48px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffc52e,#ff7d00 55%,#dc4b00);
}

.flor .brillo{
    position:absolute;
    width:75px;
    height:13px;
    left:45px;
    top:43px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    transform:rotate(-7deg);
}

/* PASTO */
.pasto{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:125px;
    background:linear-gradient(#236c2e,#0a2915);
    z-index:10;
}

.hierba{
    position:absolute;
    bottom:65px;
    width:8px;
    height:95px;
    background:linear-gradient(to right,#125823,#68d846,#1b712b);
    border-radius:100% 0 100% 0;
    transform-origin:bottom center;
    z-index:12;
    animation:hierba 2.5s ease-in-out infinite;
}
.hierba1{left:4%;transform:rotate(-25deg)}
.hierba2{left:12%;height:120px;transform:rotate(25deg);animation-delay:.3s}
.hierba3{left:25%;height:90px;transform:rotate(-20deg);animation-delay:.8s}
.hierba4{left:38%;height:115px;transform:rotate(20deg);animation-delay:1s}
.hierba5{right:38%;height:100px;transform:rotate(-25deg);animation-delay:.5s}
.hierba6{right:25%;height:120px;transform:rotate(25deg);animation-delay:.9s}
.hierba7{right:12%;height:95px;transform:rotate(-25deg);animation-delay:.2s}
.hierba8{right:4%;height:125px;transform:rotate(25deg);animation-delay:1.2s}

/* =========================
   PERSONAJE DIBUJADO EN CSS
========================= */
.personaje{
    position:absolute;
    width:185px;
    height:260px;
    left:calc(50% + var(--x,0px));
    bottom:calc(95px + var(--y,0px));
    transform:translateX(-50%) scale(var(--escala,1));
    transform-origin:center bottom;
    z-index:100;
    cursor:pointer;
    touch-action:manipulation;
    animation:brinco 1.05s ease-in-out infinite;
    user-select:none;
}

/* nombre */
.nombre{
    position:absolute;
    top:-48px;
    left:0;
    width:100%;
    text-align:center;
    color:white;
    font-size:25px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000,-1px -1px 3px #000;
    white-space:nowrap;
    pointer-events:none;
}

/* mochila */
.mochila{
    position:absolute;
    width:58px;
    height:142px;
    left:4px;
    top:94px;
    background:linear-gradient(90deg,#8f0000,#d90000 50%,#a60000);
    border:9px solid #050505;
    border-radius:38px 14px 14px 38px;
    z-index:1;
}

/* cuerpo */
.cuerpo{
    position:absolute;
    width:138px;
    height:205px;
    left:28px;
    top:38px;
    background:linear-gradient(90deg,#970000 0%,#ed0909 35%,#ff1b1b 62%,#c60000 100%);
    border:10px solid #050505;
    border-radius:75px 75px 42px 42px;
    z-index:2;
    box-shadow:inset -10px -18px 0 rgba(110,0,0,.22);
}

/* visor */
.visor{
    position:absolute;
    width:130px;
    height:78px;
    left:52px;
    top:58px;
    background:linear-gradient(145deg,#e8fbff 0%,#a7ddec 28%,#74b5cf 52%,#496774 100%);
    border:10px solid #050505;
    border-radius:52px 62px 48px 58px;
    z-index:4;
    box-shadow:inset -8px -12px 0 rgba(37,67,78,.25);
}

.visor::before{
    content:"";
    position:absolute;
    width:62px;
    height:24px;
    left:28px;
    top:8px;
    background:rgba(255,255,255,.95);
    border-radius:50%;
    transform:rotate(7deg);
}

.visor::after{
    content:"";
    position:absolute;
    width:30px;
    height:10px;
    left:76px;
    top:35px;
    background:rgba(255,255,255,.3);
    border-radius:50%;
    transform:rotate(-8deg);
}

/* piernas */
.pierna{
    position:absolute;
    width:54px;
    height:80px;
    bottom:0;
    background:linear-gradient(90deg,#a60000,#e60000 55%,#b80000);
    border:10px solid #050505;
    border-top:none;
    border-radius:0 0 28px 28px;
    z-index:3;
}
.pierna1{left:34px}
.pierna2{right:17px}

/* partículas */
.particula{
    position:absolute;
    width:7px;
    height:7px;
    background:#caff4a;
    border-radius:50%;
    opacity:.7;
    animation:flotar 4s ease-in-out infinite;
}
.p1{left:10%;top:20%}
.p2{left:30%;top:35%;animation-delay:1s}
.p3{right:15%;top:25%;animation-delay:2s}
.p4{right:32%;top:42%;animation-delay:.5s}
.p5{left:6%;top:48%;animation-delay:1.5s}
.p6{right:8%;top:55%;animation-delay:2.5s}

.particula-rompible{
    position:absolute;
    width:15px;
    height:15px;
    background:#ff1b1b;
    border:3px solid #050505;
    border-radius:4px;
    z-index:150;
    pointer-events:none;
}

/* ANIMACIONES */
@keyframes balanceo{
    0%,100%{rotate:-4deg}
    50%{rotate:4deg}
}

@keyframes hierba{
    0%,100%{margin-left:0}
    50%{margin-left:9px}
}

@keyframes brinco{
    0%,100%{
        transform:translateX(-50%) translateY(0) scale(var(--escala,1)) rotate(0deg);
    }
    25%{
        transform:translateX(calc(-50% - 55px)) translateY(-65px) scale(var(--escala,1)) rotate(-4deg);
    }
    50%{
        transform:translateX(-50%) translateY(-105px) scale(var(--escala,1)) rotate(0deg);
    }
    75%{
        transform:translateX(calc(-50% + 55px)) translateY(-65px) scale(var(--escala,1)) rotate(4deg);
    }
}

@keyframes flotar{
    0%,100%{transform:translateY(0);opacity:.3}
    50%{transform:translateY(-40px);opacity:.9}
}

/* Ajuste para pantallas pequeñas */
@media (max-width:500px){
    .personaje{
        width:155px;
        height:220px;
    }
    .cuerpo{
        width:116px;
        height:174px;
        left:24px;
        top:32px;
        border-width:8px;
    }
    .mochila{
        width:49px;
        height:120px;
        left:3px;
        top:82px;
        border-width:8px;
    }
    .visor{
        width:110px;
        height:66px;
        left:43px;
        top:49px;
        border-width:8px;
    }
    .visor::before{
        width:52px;
        height:20px;
        left:24px;
        top:7px;
    }
    .visor::after{
        width:25px;
        height:8px;
        left:65px;
        top:31px;
    }
    .pierna{
        width:45px;
        height:67px;
        border-width:8px;
    }
    .pierna1{left:28px}
    .pierna2{right:14px}
    .nombre{
        top:-42px;
        font-size:21px;
    }
}

</style>
</head>

<body>
<div class="escena">

<div class="luz"></div>

<div id="contador">Toques: 0 / 10</div>

<!-- PARTICULAS -->
<div class="particula p1"></div>
<div class="particula p2"></div>
<div class="particula p3"></div>
<div class="particula p4"></div>
<div class="particula p5"></div>
<div class="particula p6"></div>

<!-- FLOR 1 -->
<div class="flor flor1">
    <div class="tallo curvo1"></div>
    <div class="hoja hoja1"></div>
    <div class="hoja hoja2"></div>
    <div class="hoja hoja3"></div>
    <div class="cabeza">
        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
        <div class="petalo petalo5"></div>
        <div class="centro"></div>
        <div class="brillo"></div>
    </div>
</div>

<!-- FLOR 2 -->
<div class="flor flor2">
    <div class="tallo"></div>
    <div class="hoja hoja1"></div>
    <div class="hoja hoja2"></div>
    <div class="hoja hoja3"></div>
    <div class="hoja hoja4"></div>
    <div class="cabeza">
        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
        <div class="petalo petalo5"></div>
        <div class="centro"></div>
        <div class="brillo"></div>
    </div>
</div>

<!-- FLOR 3 -->
<div class="flor flor3">
    <div class="tallo curvo2"></div>
    <div class="hoja hoja1"></div>
    <div class="hoja hoja2"></div>
    <div class="hoja hoja3"></div>
    <div class="hoja hoja4"></div>
    <div class="cabeza">
        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
        <div class="petalo petalo5"></div>
        <div class="centro"></div>
        <div class="brillo"></div>
    </div>
</div>

<!-- FLOR 4 -->
<div class="flor flor4">
    <div class="tallo curvo2"></div>
    <div class="hoja hoja1"></div>
    <div class="hoja hoja2"></div>
    <div class="hoja hoja3"></div>
    <div class="cabeza">
        <div class="petalo petalo1"></div>
        <div class="petalo petalo2"></div>
        <div class="petalo petalo3"></div>
        <div class="petalo petalo4"></div>
        <div class="petalo petalo5"></div>
        <div class="centro"></div>
        <div class="brillo"></div>
    </div>
</div>

<!-- PASTO -->
<div class="pasto"></div>
<div class="hierba hierba1"></div>
<div class="hierba hierba2"></div>
<div class="hierba hierba3"></div>
<div class="hierba hierba4"></div>
<div class="hierba hierba5"></div>
<div class="hierba hierba6"></div>
<div class="hierba hierba7"></div>
<div class="hierba hierba8"></div>

</div>

<script>
const escena=document.querySelector(".escena");
const contador=document.getElementById("contador");

let toques=0;
const maximo=10;

function crearMichelle(numero,principal=false){

    const personaje=document.createElement("div");
    personaje.className="personaje";

    let x=0;
    let y=0;

    if(!principal){
        x=-150+Math.random()*300;
        y=0;
    }

    personaje.style.setProperty("--x",x+"px");
    personaje.style.setProperty("--y",y+"px");

    const escala=principal ? 1 : .65+Math.random()*.25;
    personaje.style.setProperty("--escala",escala);

    // Todos los personajes quedan visibles por encima del escenario.
    personaje.style.zIndex = 100 + numero;

    personaje.innerHTML=`
        <div class="nombre">Michelle crack</div>
        <div class="mochila"></div>
        <div class="cuerpo"></div>
        <div class="visor"></div>
        <div class="pierna pierna1"></div>
        <div class="pierna pierna2"></div>
    `;

    personaje.addEventListener("pointerdown",function(event){
        event.preventDefault();
        event.stopPropagation();

        if(numero===toques && toques<maximo){
            siguiente();
        }
    });

    escena.appendChild(personaje);
}

function siguiente(){

    if(toques>=maximo)return;

    toques++;

    contador.textContent=`Toques: ${toques} / ${maximo}`;

    crearMichelle(toques,false);

    if(toques===maximo){

        contador.textContent="🎉 ¡10 Michelle crack! 🎉";

        setTimeout(()=>{

            document.querySelectorAll(".personaje").forEach(p=>p.remove());

            toques=0;

            contador.textContent="Toques: 0 / 10";

            crearMichelle(0,true);

        },5000);
    }
}

crearMichelle(0,true);
</script>

</body>
</html>
